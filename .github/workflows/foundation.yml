name: Foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per PR; new revisions cancel obsolete work without blocking other PRs.
concurrency:
  group: foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: check (${{ matrix.suite }})
    runs-on:
      group: neverhuman-lan
      # General Linux pool supports both X64 and ARM64; no hosted fallback.
      labels: [self-hosted, Linux, lan-ci]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [fmt, clippy, rust-tests, baseline, python-tests, public-check, claims-audit, ui]
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      MPLCONFIGDIR: ${{ github.workspace }}/.private/matplotlib
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Frozen baseline controls execute the pinned historical plan commit.
          fetch-depth: 0
      - name: Install pinned Rust, including rustup on clean VMs
        if: contains(fromJSON('["fmt", "clippy", "rust-tests", "baseline", "python-tests"]'), matrix.suite)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Identify build-cache platform
        id: platform
        if: contains(fromJSON('["clippy", "rust-tests", "baseline", "python-tests"]'), matrix.suite)
        run: |
          . /etc/os-release
          echo "os=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
      - name: Restore Rust build cache
        if: contains(fromJSON('["clippy", "rust-tests", "baseline", "python-tests"]'), matrix.suite)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.platform.outputs.os }}-${{ runner.arch }}-rust-1.95.0-${{ matrix.suite }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.platform.outputs.os }}-${{ runner.arch }}-rust-1.95.0-${{ matrix.suite }}-${{ hashFiles('Cargo.lock') }}-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.suite == 'ui'
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: apps/explorer/package-lock.json
      - name: Install pinned plotting dependency for Python checks
        if: matrix.suite == 'python-tests'
        run: |
          python3 -m venv .private/ci-python
          .private/ci-python/bin/python -m pip install --disable-pip-version-check --cache-dir .private/pip-cache 'matplotlib==3.10.8'
          echo "$GITHUB_WORKSPACE/.private/ci-python/bin" >> "$GITHUB_PATH"
      # Architecture checks resolve the entire locked graph (including non-host dependencies).
      # A host-only build does not warm those packages for their offline metadata control.
      - name: Fetch complete locked graph for offline architecture controls
        if: contains(fromJSON('["rust-tests", "python-tests"]'), matrix.suite)
        run: cargo fetch --locked
      - name: Precompile Rust workspace test binaries outside suite timer
        if: matrix.suite == 'rust-tests'
        run: cargo test --workspace --locked --no-run
      - name: Run suite with exact logs and receipt
        env:
          CHECK_SUITE: ${{ matrix.suite }}
        run: bash ops/ci/foundation.sh --suite "$CHECK_SUITE"
      - name: Retain reviewed check receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-${{ matrix.suite }}-${{ github.run_attempt }}
          # Selected JSON only; no private inputs or raw log archives.
          path: .private/checks/*/receipt.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Preserve the required-check name; failed/cancelled/skipped lanes cannot pass.
  foundation:
    name: foundation
    needs: checks
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      group: neverhuman-lan
      labels: [self-hosted, Linux, lan-ci]
    timeout-minutes: 5
    steps:
      - name: Require every foundation suite
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$CHECKS_RESULT" = success
