[workspace]
resolver = "2"
members = ["crates/joil-core", "crates/joil-cli", "crates/joil-evidence", "crates/joil-ir", "crates/crucible-units", "crates/crucible-contract", "crates/crucible-architecture", "crates/crucible-store", "crates/crucible-runtime", "crates/crucible-cli", "crates/crucible-stats", "crates/joil-geometry", "crates/crucible-geom", "crates/crucible-genome"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
