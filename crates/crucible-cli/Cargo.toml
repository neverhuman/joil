[package]
name = "crucible-cli"
default-run = "crucible"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml = "=0.8.23"
libc = "=0.2.190"
crucible-runtime = { path = "../crucible-runtime" }
crucible-store = { path = "../crucible-store" }
joil-evidence = { path = "../joil-evidence" }

[[bin]]
name = "crucible"
path = "src/main.rs"

[[bin]]
name = "mesh-reference-plane"
path = "src/bin/mesh-reference-plane.rs"

[[bin]]
name = "mesh-extend-outlet"
path = "src/bin/mesh-extend-outlet.rs"
